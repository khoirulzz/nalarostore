name = "nalarostore"
main = "worker/index.ts"
compatibility_date = "2026-10-13"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_ENV = "development"
ENABLE_LIVE_CHECKOUT = "false"

# Add Hyperdrive binding only after Aiven PostgreSQL is provisioned and tested.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "YOUR_CONFIG_ID"

# Add R2 binding only after bucket provisioning and cost review.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "nalarostore-media"
